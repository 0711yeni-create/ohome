name: Build O.HOME APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android wrapper
        env:
          OHOME_URL: ${{ vars.OHOME_URL }}
        run: |
          if [ -z "$OHOME_URL" ]; then
            echo "Repository variable OHOME_URL is required." >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const url = process.env.OHOME_URL;

          fs.writeFileSync('capacitor.config.ts', `import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'app.ohome.mobile',
            appName: 'O.HOME',
            webDir: 'public',
            server: { url: ${JSON.stringify(url)}, cleartext: false },
            android: { allowMixedContent: false },
          };

          export default config;
          `);
          NODE

          npx cap add android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OHOME-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
